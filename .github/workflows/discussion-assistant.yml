name: Discussion Assistant

on:
  discussion:
    types: [created]

permissions:
  discussions: write
  contents: read

jobs:
  find-similar-discussions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Find and comment on similar discussions
        uses: actions/github-script@v8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Configuration
            const MAX_RESULTS = 5;
            const MAX_HELP_TOPICS = 5;
            const DOCS_MCP_URL = 'https://docs.open-systems-pharmacology.org/~gitbook/mcp';
            const DOCS_HOSTNAME = 'docs.open-systems-pharmacology.org';
            const MCP_PROTOCOL_VERSION = '2025-06-18';
            const DOCS_MCP_TIMEOUT_MS = 15000; // best-effort enrichment, keep the budget small
            const MIN_HELP_TOPIC_SIMILARITY = 0.35; // embedding similarity discussion <-> documentation page
            const MIN_HELP_TOPIC_RELEVANCE = 0.15; // keyword fallback: share of discussion keywords covered by the page
            const MIN_HELP_TOPIC_KEYWORDS = 3; // keyword fallback: minimum number of shared keywords
            const MIN_SIMILARITY_TO_COMMENT = 0.65;
            const MIN_KEYWORD_SIMILARITY = 0.20;
            const IGNORED_CATEGORIES = ['Announcement', 'Announcements', 'Polls', 'Poll']; // Categories to ignore
            
            // Get the new discussion details
            const discussionNumber = context.payload.discussion.number;
            const discussionTitle = context.payload.discussion.title;
            const discussionBody = context.payload.discussion.body || '';
            const discussionUrl = context.payload.discussion.html_url;
            const discussionCategory = context.payload.discussion.category?.name || '';
            
            console.log(`Processing new discussion #${discussionNumber}: "${discussionTitle}"`);
            console.log(`Category: ${discussionCategory}`);
            
            // Check if discussion is in an ignored category
            if (IGNORED_CATEGORIES.some(cat => discussionCategory.toLowerCase().includes(cat.toLowerCase()))) {
              console.log(`Skipping discussion in category "${discussionCategory}" - category is in ignore list`);
              return;
            }
            
            // Function to fetch all discussions using GraphQL
            async function fetchAllDiscussions() {
              const query = `
                query($owner: String!, $repo: String!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    discussions(first: 100, after: $cursor, orderBy: {field: CREATED_AT, direction: DESC}) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        number
                        title
                        body
                        url
                        createdAt
                        category {
                          name
                        }
                        answer {
                          id
                        }
                      }
                    }
                  }
                }
              `;
              
              let allDiscussions = [];
              let hasNextPage = true;
              let cursor = null;
              
              while (hasNextPage) {
                const result = await github.graphql(query, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cursor: cursor
                });
                
                const discussions = result.repository.discussions.nodes;
                // Filter out the current discussion and ignored categories
                const filtered = discussions.filter(d => {
                  if (d.number === discussionNumber) return false;
                  const category = d.category?.name || '';
                  if (IGNORED_CATEGORIES.some(cat => category.toLowerCase().includes(cat.toLowerCase()))) {
                    return false;
                  }
                  return true;
                });
                allDiscussions = allDiscussions.concat(filtered);
                
                hasNextPage = result.repository.discussions.pageInfo.hasNextPage;
                cursor = result.repository.discussions.pageInfo.endCursor;
                
                // Limit to prevent excessive API calls (adjust as needed)
                if (allDiscussions.length >= 1000) break;
              }
              
              console.log(`Fetched ${allDiscussions.length} existing discussions (excluding ignored categories)`);
              return allDiscussions;
            }
            
            // Function to calculate similarity using OpenAI embeddings
            async function calculateSimilarityOpenAI(newText, existingDiscussions) {
              const apiKey = process.env.OPENAI_API_KEY;
              if (!apiKey) {
                console.log('OPENAI_API_KEY not found, skipping AI analysis');
                return [];
              }
              
              try {
                // Get embedding for new discussion
                const newEmbedding = await getEmbedding(newText, apiKey);
                
                // Prepare texts for batch embedding with indices
                const existingTexts = existingDiscussions.map(d => `${d.title}\n${d.body || ''}`);
                
                // Process in batches of 50
                const BATCH_SIZE = 50;
                const MAX_RETRIES = 3;
                const discussionEmbeddings = []; // Array of {discussion, embedding} pairs
                
                for (let i = 0; i < existingTexts.length; i += BATCH_SIZE) {
                  const batchStart = i;
                  const batchEnd = Math.min(i + BATCH_SIZE, existingTexts.length);
                  const batch = existingTexts.slice(batchStart, batchEnd);
                  
                  let success = false;
                  for (let attempt = 1; attempt <= MAX_RETRIES && !success; attempt++) {
                    try {
                      const batchEmbeddings = await getEmbedding(batch, apiKey);
                      if (!Array.isArray(batchEmbeddings) || batchEmbeddings.length !== batch.length) {
                        throw new Error(`Expected ${batch.length} embeddings, got ${batchEmbeddings?.length || 0}`);
                      }
                      // Map embeddings back to their discussions
                      for (let j = 0; j < batchEmbeddings.length; j++) {
                        discussionEmbeddings.push({
                          discussion: existingDiscussions[batchStart + j],
                          embedding: batchEmbeddings[j]
                        });
                      }
                      success = true;
                    } catch (batchError) {
                      console.error(`Error processing batch ${Math.floor(i / BATCH_SIZE) + 1} (discussions ${batchStart}-${batchEnd - 1}), attempt ${attempt}/${MAX_RETRIES}:`, batchError);
                      if (attempt < MAX_RETRIES) {
                        const backoff = Math.pow(2, attempt) * 1000;
                        console.log(`Retrying in ${backoff / 1000}s...`);
                        await new Promise(resolve => setTimeout(resolve, backoff));
                      }
                    }
                  }
                  // Delay between batches to avoid rate limits
                  if (i + BATCH_SIZE < existingTexts.length) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                  }
                }
                
                if (discussionEmbeddings.length === 0) {
                  console.log('Failed to retrieve embeddings for all discussion batches. Check API key, quota, and network connectivity.');
                  throw new Error('Failed to retrieve embeddings for all discussion batches');
                }
                
                if (discussionEmbeddings.length < existingDiscussions.length) {
                  console.log(`Warning: Only got ${discussionEmbeddings.length} embeddings for ${existingDiscussions.length} discussions. Some batches may have failed.`);
                }
                
                // Calculate similarity scores
                const similarities = [];
                
                for (const item of discussionEmbeddings) {
                  const similarity = cosineSimilarity(newEmbedding, item.embedding);
                  
                  if (similarity >= MIN_SIMILARITY_TO_COMMENT) {
                    similarities.push({
                      discussion: item.discussion,
                      similarity
                    });
                  }
                }
                
                // Sort by similarity and return top results
                similarities.sort((a, b) => b.similarity - a.similarity);
                return similarities.slice(0, MAX_RESULTS);
                
              } catch (error) {
                console.error('Error calculating similarity:', error);
                return [];
              }
            }
            
            // Function to get embedding from OpenAI
            async function getEmbedding(text, apiKey) {
              const response = await fetch('https://api.openai.com/v1/embeddings', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                  model: 'text-embedding-3-small',
                  input: Array.isArray(text) 
                    ? text.map(t => t.substring(0, 8000)) 
                    : text.substring(0, 8000)
                }),
                signal: AbortSignal.timeout(60000) // 60s timeout
              });
              
              if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`OpenAI API error: ${response.status} ${response.statusText} - ${errorBody}`);
              }
              
              const data = await response.json();
              // Return single embedding or array of embeddings
              return Array.isArray(text) 
                ? data.data.sort((a, b) => a.index - b.index).map(item => item.embedding)
                : data.data[0].embedding;
            }
            
            // Function to calculate cosine similarity
            function cosineSimilarity(vecA, vecB) {
              let dotProduct = 0;
              let normA = 0;
              let normB = 0;
              
              for (let i = 0; i < vecA.length; i++) {
                dotProduct += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
              }
              
              const denominator = Math.sqrt(normA) * Math.sqrt(normB);
              return denominator === 0 ? 0 : dotProduct / denominator;
            }
            
            // Function to use simple keyword matching as fallback
            function calculateSimilarityKeywords(newText, existingDiscussions) {
              const newKeywords = extractKeywords(newText);
              const similarities = [];
              
              for (const discussion of existingDiscussions) {
                const existingText = `${discussion.title}\n${discussion.body || ''}`;
                const existingKeywords = extractKeywords(existingText);
                
                const similarity = keywordSimilarity(newKeywords, existingKeywords);
                
                if (similarity >= MIN_KEYWORD_SIMILARITY) {
                  similarities.push({
                    discussion,
                    similarity
                  });
                }
              }
              
              similarities.sort((a, b) => b.similarity - a.similarity);
              return similarities.slice(0, MAX_RESULTS);
            }
            
            // Extract keywords (simple implementation)
            function extractKeywords(text) {
              const stopWords = new Set(['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'from', 'is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should', 'may', 'might', 'can', 'this', 'that', 'these', 'those', 'i', 'you', 'he', 'she', 'it', 'we', 'they', 'what', 'which', 'who', 'when', 'where', 'why', 'how']);
              
              const words = text.toLowerCase()
                .replace(/[^\w\s]/g, ' ')
                .split(/\s+/)
                .filter(word => word.length > 3 && !stopWords.has(word));
              
              return words;
            }
            
            // Calculate keyword similarity using Jaccard index
            function keywordSimilarity(keywords1, keywords2) {
              const set1 = new Set(keywords1);
              const set2 = new Set(keywords2);
              
              const intersection = new Set([...set1].filter(x => set2.has(x)));
              const union = new Set([...set1, ...set2]);
              
              return intersection.size / union.size;
            }
            
            // Call a tool on the OSP documentation MCP server (streamable HTTP transport).
            // NOTE: the discussion title and body are sent to this third-party endpoint.
            // A fresh `initialize` handshake is performed for every call because the server
            // is stateless (it returns no `Mcp-Session-Id`); if it ever starts requiring
            // sessions, the session id would have to be carried over to the tools/call request.
            async function callDocsMcpTool(toolName, args) {
              await postDocsMcpRequest({
                jsonrpc: '2.0',
                id: 1,
                method: 'initialize',
                params: {
                  protocolVersion: MCP_PROTOCOL_VERSION,
                  capabilities: {},
                  clientInfo: { name: 'discussion-assistant', version: '1.0.0' }
                }
              });

              const result = await postDocsMcpRequest({
                jsonrpc: '2.0',
                id: 2,
                method: 'tools/call',
                params: { name: toolName, arguments: args }
              });

              if (!result) {
                throw new Error('Docs MCP returned an empty result');
              }
              if (result.isError) {
                const details = (result.content || [])
                  .filter(item => item.type === 'text')
                  .map(item => item.text)
                  .join('\n');
                throw new Error(`Docs MCP tool "${toolName}" failed: ${details || 'no details provided'}`);
              }

              return result;
            }

            // Send a single JSON-RPC request and return its result
            async function postDocsMcpRequest(payload) {
              const response = await fetch(DOCS_MCP_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream',
                  'MCP-Protocol-Version': MCP_PROTOCOL_VERSION
                },
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(DOCS_MCP_TIMEOUT_MS)
              });

              if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`Docs MCP error: ${response.status} ${response.statusText} - ${errorBody}`);
              }

              const rawBody = await response.text();
              const contentType = response.headers.get('content-type') || '';

              let message;
              if (contentType.includes('text/event-stream')) {
                // Parse SSE: pick the "data:" frame carrying the response to our request id
                for (const line of rawBody.split('\n')) {
                  const trimmed = line.trim();
                  if (!trimmed.startsWith('data:')) continue;
                  try {
                    const parsed = JSON.parse(trimmed.slice(5).trim());
                    if (parsed.id === payload.id && (parsed.result !== undefined || parsed.error)) {
                      message = parsed;
                      break;
                    }
                  } catch (parseError) {
                    // Ignore non-JSON data lines
                  }
                }
              } else {
                message = JSON.parse(rawBody);
              }

              if (!message) {
                throw new Error(`Docs MCP response for "${payload.method}" did not contain a matching JSON-RPC message`);
              }
              if (message.error) {
                throw new Error(`Docs MCP error: ${message.error.message || JSON.stringify(message.error)}`);
              }

              return message.result;
            }

            // Accept only https links pointing at the official documentation host.
            // The MCP server is untrusted input, and the resulting link ends up in a
            // comment posted with GITHUB_TOKEN, so anything else is discarded.
            function sanitizeDocsLink(link) {
              let url;
              try {
                url = new URL(link);
              } catch (error) {
                return null;
              }

              if (url.protocol !== 'https:' || url.hostname !== DOCS_HOSTNAME) return null;
              // Characters that would break out of the markdown link target
              if (/[()<>\s\\]/.test(url.href)) return null;

              return url;
            }

            // Versioned pages (e.g. /v13/foo) duplicate the current page (/foo)
            function normalizedDocsPath(url) {
              return url.pathname.replace(/^\/v\d+(?=\/|$)/, '') || '/';
            }

            // Share of the discussion keywords that also appear in the documentation page.
            // Requires a minimum number of shared keywords so that very short discussions
            // cannot reach the threshold on one or two incidental word matches.
            function keywordCoverage(queryKeywords, topicKeywords) {
              const querySet = new Set(queryKeywords);
              if (querySet.size === 0) return 0;

              const topicSet = new Set(topicKeywords);
              const covered = [...querySet].filter(word => topicSet.has(word));
              if (covered.length < MIN_HELP_TOPIC_KEYWORDS) return 0;
              return covered.length / querySet.size;
            }

            // Score help topics against the discussion, preferring embeddings when available
            async function scoreHelpTopics(query, candidates) {
              const apiKey = process.env.OPENAI_API_KEY;
              if (apiKey) {
                try {
                  const embeddings = await getEmbedding([query, ...candidates.map(c => c.text)], apiKey);
                  const queryEmbedding = embeddings[0];
                  return candidates.map((candidate, index) => ({
                    candidate,
                    score: cosineSimilarity(queryEmbedding, embeddings[index + 1]),
                    threshold: MIN_HELP_TOPIC_SIMILARITY
                  }));
                } catch (error) {
                  console.error('Error embedding help topics, falling back to keyword matching:', error);
                }
              }

              const queryKeywords = extractKeywords(query);
              return candidates.map(candidate => ({
                candidate,
                score: keywordCoverage(queryKeywords, extractKeywords(candidate.text)),
                threshold: MIN_HELP_TOPIC_RELEVANCE
              }));
            }

            // Search the OSP documentation for help topics relevant to the discussion
            async function findHelpTopics(query) {
              try {
                const result = await callDocsMcpTool('searchDocumentation', {
                  query: query.substring(0, 1000)
                });

                const candidates = [];
                const seenPaths = new Set();

                for (const item of result.content || []) {
                  if (item.type !== 'text' || !item.text) continue;

                  const titleMatch = item.text.match(/^Title:\s*(.+)$/m);
                  const linkMatch = item.text.match(/^Link:\s*(\S+)$/m);
                  if (!titleMatch || !linkMatch) continue;

                  const url = sanitizeDocsLink(linkMatch[1]);
                  if (!url) {
                    console.log(`Skipping help topic with unexpected link: ${linkMatch[1]}`);
                    continue;
                  }

                  const path = normalizedDocsPath(url);
                  if (seenPaths.has(path)) continue;
                  seenPaths.add(path);

                  candidates.push({ title: titleMatch[1].trim(), link: url.href, text: item.text });
                }

                const scored = await scoreHelpTopics(query, candidates);
                const topics = scored
                  .filter(item => item.score >= item.threshold)
                  .sort((a, b) => b.score - a.score)
                  .slice(0, MAX_HELP_TOPICS)
                  .map(item => ({ title: item.candidate.title, link: item.candidate.link }));

                console.log(`Found ${topics.length} relevant help topics in the OSP documentation (${candidates.length} candidates)`);
                return topics;
              } catch (error) {
                // Surfaced as a warning so that a permanent outage of the docs MCP server
                // is visible in the workflow run instead of looking like "no topics found"
                core.warning(`Error searching OSP documentation: ${error.message}`);
                return [];
              }
            }

            // Main execution
            try {
              // Fetch all existing discussions
              const existingDiscussions = await fetchAllDiscussions();

              // Prepare text for comparison
              const newText = `${discussionTitle}\n${discussionBody}`;

              // Try AI-based similarity first, fallback to keyword matching
              let similarDiscussions = [];
              if (existingDiscussions.length === 0) {
                console.log('No existing discussions found');
              } else {
                if (process.env.OPENAI_API_KEY) {
                  console.log('Using OpenAI for similarity analysis');
                  similarDiscussions = await calculateSimilarityOpenAI(newText, existingDiscussions);
                }
                if (!similarDiscussions || similarDiscussions.length === 0) {
                  console.log('Using keyword matching for similarity analysis');
                  similarDiscussions = calculateSimilarityKeywords(newText, existingDiscussions);
                }
              }

              // Look for relevant help topics in the OSP documentation
              const helpTopics = await findHelpTopics(newText);

              // Post comment if similar discussions and/or help topics were found
              if (similarDiscussions.length > 0 || helpTopics.length > 0) {
                console.log(`Found ${similarDiscussions.length} similar discussions and ${helpTopics.length} help topics`);

                let commentBody = '🤖 **Discussion Assistant**\n\n';

                if (similarDiscussions.length > 0) {
                  commentBody += 'I found some similar discussions that might be helpful:\n\n';

                  for (const item of similarDiscussions) {
                    const { discussion, similarity } = item;
                    const percentage = Math.round(similarity * 100);
                    const answeredTag = discussion.answer ? ' ✅ (Answered)' : '';

                    const safeTitle = discussion.title.replace(/\[/g, '\\[').replace(/\]/g, '\\]');
                    commentBody += `- [${safeTitle}](${discussion.url}) (${percentage}% similar)${answeredTag}\n`;
                  }
                }

                if (helpTopics.length > 0) {
                  if (similarDiscussions.length > 0) commentBody += '\n';
                  commentBody += 'Relevant help topics from the [Open Systems Pharmacology Documentation](https://docs.open-systems-pharmacology.org/):\n\n';

                  for (const topic of helpTopics) {
                    const safeTitle = topic.title.replace(/\[/g, '\\[').replace(/\]/g, '\\]');
                    commentBody += `- [${safeTitle}](${topic.link})\n`;
                  }
                }

                // Post the comment using GraphQL
                const discussionId = context.payload.discussion.node_id;
                
                const mutation = `
                  mutation($discussionId: ID!, $body: String!) {
                    addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                      comment {
                        id
                      }
                    }
                  }
                `;
                
                await github.graphql(mutation, {
                  discussionId: discussionId,
                  body: commentBody
                });
                
                console.log('Comment posted successfully');
              } else {
                console.log('No similar discussions above threshold and no relevant help topics found');
              }
              
            } catch (error) {
              console.error('Error in discussion assistant:', error);
              core.setFailed(error.message);
            }
